<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alpha Academy Trading Floor</title>
  <meta name="description" content="The Alpha Academy stock market game: practice investing with real market prices and learn the money skills that last. A program of the Gamma Iota Lambda Chapter of Alpha Phi Alpha Fraternity, Inc.">
  <meta name="theme-color" content="#0f0e0b">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('aatf.theme') || '"auto"');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <noscript><p style="padding:24px">The Alpha Academy Trading Floor needs JavaScript turned on.</p></noscript>
  </div>
  <script src="config.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
